name: deploy-dev

on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job request the GitHub OIDC token
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    # GitHub variables become Terraform variables (TF_VAR_<name>)
    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_landing_bucket: ${{ vars.LANDING_BUCKET }}
      TF_VAR_database_name: ${{ vars.DATABASE_NAME }}
      TF_VAR_snowflake_access_role_name: ${{ vars.SNOWFLAKE_ACCESS_ROLE_NAME }}
      TF_VAR_snowflake_organization_name: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_snowflake_account_name: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_snowflake_user: ${{ vars.SNOWFLAKE_USER }}
      TF_VAR_snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
      TF_VAR_snowflake_private_key_path: ~/.snowflake/rsa_key.p8 # where the fetch step below writes the key
      # Empty until the first run has produced them; Terraform treats empty as "not yet"
      TF_VAR_snowflake_iam_user_arn: ${{ vars.SNOWFLAKE_IAM_USER_ARN }}
      TF_VAR_snowflake_external_id: ${{ vars.SNOWFLAKE_EXTERNAL_ID }}
      TF_VAR_snowpipe_queue_arn: ${{ vars.SNOWPIPE_QUEUE_ARN }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          disable-retry: true # fail on the first error so the real message shows
      - name: Show who AWS thinks we are
        run: aws sts get-caller-identity

      # The Snowflake provider reads its key from ~/.snowflake/rsa_key.p8
      - name: Fetch Snowflake private key from Secrets Manager
        run: |
          mkdir -p ~/.snowflake
          aws secretsmanager get-secret-value \
            --secret-id kb-pipeline/dev/snowflake-private-key \
            --query SecretString --output text > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Terraform init
        run: terraform init -input=false -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: Terraform validate
        run: terraform validate

      # Plan only. Applying needs broader permissions than the deploy role has today.
      - name: Terraform plan
        run: terraform plan -input=false