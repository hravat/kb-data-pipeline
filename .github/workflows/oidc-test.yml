name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job request the GitHub OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Show who AWS thinks we are
        run: aws sts get-caller-identity
