name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job request the GitHub OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: dev # the role trusts GitHub environments, so the job must name one
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          disable-retry: true # fail on the first error so the real message shows
      - name: Show who AWS thinks we are
        run: aws sts get-caller-identity
