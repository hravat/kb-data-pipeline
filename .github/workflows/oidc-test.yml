name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job request the GitHub OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show the OIDC identity GitHub will send to AWS
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print({k: claims.get(k) for k in ("sub", "aud", "iss", "repository", "ref", "job_workflow_ref")})
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          disable-retry: true # fail on the first error so the real message shows
      - name: Show who AWS thinks we are
        run: aws sts get-caller-identity
