name: runner-test

on:
  workflow_dispatch:

jobs:
  check-floci:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd # PowerShell scripts are blocked by the execution policy on this machine
    steps:
      - name: Where am I running
        run: |
          hostname
          docker --version

      - name: Containers on this machine
        run: docker ps --format "{{.Names}}  {{.Status}}"

      - name: Reach floci on localhost
        run: curl.exe -s -I -m 5 http://localhost:4566
